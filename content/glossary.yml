groups:
  - name: 기본
    terms:
      - term: LLM
        en: Large Language Model
        desc: "말(텍스트)을 다루는 큰 모델. 다음에 올 말을 확률로 고르는 일을 아주 잘하도록 만들어진 것."
        link: what-is-llm
      - term: 파운데이션 모델
        desc: "특정 업무용이 아니라 **아무 일에나 얹어 쓰는 바닥재**로 만든 모델. LLM은 그중 언어를 다루는 것."
        link: what-is-llm
      - term: 모델 / 서비스
        desc: "모델은 엔진, 서비스는 그 엔진을 감싼 앱. 같은 모델이라도 앱이 다르면 결과가 다르다."
        link: what-is-llm
      - term: 프롬프트
        desc: "AI에게 주는 입력. 잘 물어보는 요령이 아니라 **그 작업의 명세**로 쓰는 것이 맞다."
        link: spec-not-prompt
      - term: 시스템 프롬프트
        desc: "서비스가 미리 넣어 둔 기본 지시. 사용자 눈에는 안 보이지만 항상 함께 전달된다."
      - term: 토큰
        desc: "글을 모델이 다루기 쉽게 자른 단위. 단어보다 작고 글자보다 크다. 길면 비싸고 느려진다."
        link: tokens-and-context
      - term: 컨텍스트 창
        desc: "한 번에 올려 둘 수 있는 양. **책상 크기**로 생각하면 된다. 넘치면 앞쪽이 밀려난다."
        link: tokens-and-context
      - term: 환각
        en: hallucination
        desc: "모르는 것을 그럴듯한 형태로 채워 말하는 현상. 문체의 자신감은 정확도와 무관하다."
        link: why-ai-is-confidently-wrong
      - term: 멀티모달
        desc: "글 외에 이미지·음성 등을 같이 다루는 것. 뒤에서는 서로 다른 모델이 각각 일한다."

  - name: 지식을 넣는 방법
    terms:
      - term: 사전학습
        en: pre-training
        desc: "모델을 만들 때 넓은 자료로 크게 학습시키는 단계. 이때의 지식은 **시점이 고정**된다."
      - term: 파인튜닝
        desc: "만들어진 모델을 추가 학습시키는 것. **말투·형식을 바꾸는 데** 강하고 사실을 기억시키는 데는 약하다."
        link: rag-basics
      - term: RAG
        desc: "학습시키는 대신 **질문에 관련된 문서를 찾아서 함께 넣어 주는** 방식. 파일 첨부가 가장 단순한 형태다."
        link: rag-basics
      - term: 청킹
        en: chunking
        desc: "긴 문서를 조각으로 자르는 일. 표가 중간에서 잘리는 등, 답이 나쁜 원인이 대개 여기 있다."
        link: rag-basics
      - term: 임베딩
        desc: "글의 의미를 숫자 배열로 바꿔 두는 것. 그래서 표현이 달라도 뜻이 가까운 조각을 찾을 수 있다."
      - term: 리랭크
        en: re-rank
        desc: "찾아온 조각들을 다시 한 번 골라 순서를 매기는 단계. 정확도에 큰 차이를 낸다."
      - term: 벡터 저장소
        desc: "임베딩된 조각을 넣어 두고 의미로 검색하는 저장소."

  - name: 에이전트
    terms:
      - term: 에이전트
        desc: "답을 주는 데서 멈추지 않고 **일을 끝내는** 것. 손이 있고, 스스로 반복하고, 끝을 판정한다."
        link: chatbot-vs-agent
      - term: 도구 사용
        en: tool use · function call
        desc: "모델이 검색·파일·외부 시스템을 직접 호출하는 것. 말만 하던 AI에게 손이 생기는 부분."
        link: chatbot-vs-agent
      - term: 에이전트 루프
        desc: "계획 → 실행 → 결과 확인 → 다음 행동을 **스스로** 반복하는 구조. 챗봇과의 결정적 차이."
        link: chatbot-vs-agent
      - term: MCP
        desc: "AI가 외부 도구·데이터에 연결되는 **공통 규격**. 도구마다 제각각이던 연결을 하나로 정리했다."
        link: what-is-mcp
      - term: 멀티에이전트
        desc: "여러 에이전트가 나눠 일하는 구조. 반년 전까지 고급 기술이었고 지금은 기본 기능에 들어와 있다."
      - term: 오케스트레이션
        desc: "여러 개를 **어떤 순서로 돌리고 어디까지 맡기고 어디서 끊을지** 통제하는 일. 지금의 실질적 병목."
      - term: 명세
        desc: "목표 · 재료 · 판정 기준 · 금지 · 산출물 형식. 요령은 버려지지만 명세는 재사용된다."
        link: spec-not-prompt
      - term: 자기검증
        desc: "만든 결과를 스스로 확인하고 고치게 하는 것. 확인할 수 없는 일은 맡길 수 없다."
        link: make-ai-verify

  - name: 비용과 선택
    terms:
      - term: 모델 등급
        desc: "성적순이 아니라 **판단력을 속도·비용과 교환**하는 조건. 전부 최상위로 쓰는 것이 가장 흔한 낭비다."
        link: which-model
      - term: 프롬프트 캐시
        desc: "같은 앞부분을 반복해 보낼 때 다시 계산하지 않고 재사용하는 구조. 앞을 고정하고 뒤만 바꾸면 유리하다."
        link: where-tokens-go
      - term: 사용량
        desc: "질문 길이가 아니라 **대화 누적**에 비례한다. 매 턴마다 지금까지의 대화 전체를 다시 읽기 때문."
        link: where-tokens-go
      - term: 웹 / 데스크톱 앱
        desc: "같은 서비스라도 브라우저로 쓰면 대화창, 컴퓨터에 설치하면 **내 파일을 직접 다루는 작업 도구**가 된다."
        link: why-desktop-app
      - term: STT · TTS · OCR
        desc: "각각 말을 글로, 글을 말로, 이미지 속 글자를 데이터로."
